name: Set up CI base
description: Prepare common CI prerequisites (Go, cache, tools). Requires checkout before use.
inputs:
  prepareMultiarch:
    default: "false"
    description: Whether to ensure the runner supports multiarch builds.
  installGolangciLint:
    default: "false"
    description: Whether to ensure golangci-lint is installed.
runs:
  using: composite
  steps:
    - if: inputs.prepareMultiarch == 'true'
      name: Set up multiarch support
      id: qemu
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
        reset: false

    - if: inputs.prepareMultiarch == 'true'
      name: Verify ARM64 support
      shell: bash
      env:
        QEMU_PLATFORMS: ${{ steps.qemu.outputs.platforms }}
      run: |
        case ",${QEMU_PLATFORMS}," in
          *,linux/arm64,*) ;;
          *)
            echo "::error::QEMU setup did not enable linux/arm64 support."
            exit 1
            ;;
        esac

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        cache: false
        go-version-file: go.mod

    - name: Add Go bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Restore Go tools cache
      uses: actions/cache@v5
      with:
        path: |
          ~/go/bin/ginkgo
          ~/go/bin/golangci-lint
        key: ${{ runner.os }}-go-tools-${{ hashFiles('go.mod', 'go.sum', 'Taskfile.dist.yaml') }}

    - if: inputs.installGolangciLint == 'true'
      name: Install golangci-lint
      shell: bash
      run: |
        command -v golangci-lint >/dev/null 2>&1 || task --yes deps:install:golangci-lint
