name: Set up CI base
description: Prepare common CI prerequisites (Go, cache, tools). Requires checkout before use.
inputs:
  prepareMultiarch:
    default: "false"
    description: Whether to verify the runner supports multiarch builds.
  installGolangciLint:
    default: "false"
    description: Whether to ensure golangci-lint is installed.
runs:
  using: composite
  steps:
    - if: inputs.prepareMultiarch == 'true'
      name: Check multiarch support
      shell: bash
      run: |
        if ! grep -q '^enabled$' /proc/sys/fs/binfmt_misc/qemu-aarch64 ||
           ! grep -q '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64; then
          echo "::error::Provision persistent qemu-aarch64 binfmt support on the runner before accepting jobs."
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        cache: false
        go-version-file: go.mod

    - name: Add Go bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Restore Go tools cache
      uses: actions/cache@v5
      with:
        path: |
          ~/go/bin/ginkgo
          ~/go/bin/golangci-lint
        key: ${{ runner.os }}-go-tools-${{ hashFiles('go.mod', 'go.sum', 'Taskfile.dist.yaml') }}

    - if: inputs.installGolangciLint == 'true'
      name: Install golangci-lint
      shell: bash
      run: |
        command -v golangci-lint >/dev/null 2>&1 || task --yes deps:install:golangci-lint
