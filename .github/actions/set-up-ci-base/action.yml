name: Set up CI base
description: Prepare common CI prerequisites (Go, cache, tools). Requires checkout before use.
inputs:
  prepareMultiarch:
    default: "false"
    description: Whether to ensure the runner supports multiarch builds.
  installGolangciLint:
    default: "false"
    description: Whether to ensure golangci-lint is installed.
  foxDeliveryKitSdkDeployToken:
    required: true
    description: read_repository deploy token of deckhouse/delivery/delivery-kit-sdk on fox.
  foxElfeditDeployToken:
    required: true
    description: read_repository deploy token of deckhouse/delivery/elfedit on fox.
runs:
  using: composite
  steps:
    - if: inputs.prepareMultiarch == 'true'
      name: Set up multiarch support
      id: qemu
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
        reset: false

    - if: inputs.prepareMultiarch == 'true'
      name: Verify ARM64 support
      shell: bash
      env:
        QEMU_PLATFORMS: ${{ steps.qemu.outputs.platforms }}
      run: |
        case ",${QEMU_PLATFORMS}," in
          *,linux/arm64,*) ;;
          *)
            echo "::error::QEMU setup did not enable linux/arm64 support."
            exit 1
            ;;
        esac

    - name: Set up git config
      uses: ./.github/actions/set-up-git-config

    - name: Reach the internal Go modules on fox
      shell: bash
      env:
        FOX_DELIVERY_KIT_SDK_DEPLOY_TOKEN: ${{ inputs.foxDeliveryKitSdkDeployToken }}
        FOX_ELFEDIT_DEPLOY_TOKEN: ${{ inputs.foxElfeditDeployToken }}
      run: |
        for name in FOX_DELIVERY_KIT_SDK_DEPLOY_TOKEN FOX_ELFEDIT_DEPLOY_TOKEN; do
          [[ -n "${!name}" ]] || { echo "::error::$name is empty: the secret is missing, or this is a pull request from a fork"; exit 1; }
        done
        # GIT_CONFIG_GLOBAL is the job-local file set-up-git-config created: the runner is
        # persistent and shared between jobs, so the tokens must not reach ~/.gitconfig.
        git config --global url."https://delivery-kit-ci:${FOX_DELIVERY_KIT_SDK_DEPLOY_TOKEN}@fox.flant.com/deckhouse/delivery/delivery-kit-sdk".insteadOf "https://flant.internal/deckhouse/delivery/delivery-kit-sdk"
        git config --global url."https://delivery-kit-ci:${FOX_ELFEDIT_DEPLOY_TOKEN}@fox.flant.com/deckhouse/delivery/elfedit".insteadOf "https://flant.internal/deckhouse/delivery/elfedit"
        echo "GOPRIVATE=flant.internal" >> "$GITHUB_ENV"

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        cache: false
        go-version-file: go.mod

    - name: Set up job tools directory
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/bin"
        echo "GOBIN=$GITHUB_WORKSPACE/bin" >> "$GITHUB_ENV"
        echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

    - name: Restore Go tools cache
      uses: actions/cache@v5
      with:
        path: |
          bin/ginkgo
          bin/golangci-lint-v2.11.4
        key: ${{ runner.os }}-go-tools-workspace-v1-${{ hashFiles('go.mod', 'go.sum', 'Taskfile.dist.yaml') }}

    - name: Install matching ginkgo
      shell: bash
      run: |
        expected_version="$(awk '$1 == "github.com/onsi/ginkgo/v2" && $2 ~ /^v[0-9]/ { print $2; exit }' go.mod)"
        installed_version=""
        if [[ -x "$GOBIN/ginkgo" ]]; then
          installed_version="v$("$GOBIN/ginkgo" version | awk '{print $3}')"
        fi
        if [[ "$installed_version" != "$expected_version" ]]; then
          task --yes deps:install:ginkgo
        fi

    - if: inputs.installGolangciLint == 'true'
      name: Install golangci-lint
      shell: bash
      run: |
        [[ -x "$GOBIN/golangci-lint-v2.11.4" ]] || task --yes deps:install:golangci-lint
