name: Set up prebuilt werf test binary
description: Build or download a werf binary and configure the test runtime.
inputs:
  artifact:
    default: ""
    description: Download this artifact instead of building the test binary.
  coverage:
    default: "false"
    description: Enable coverage collection for the test binary.
  raceDetectorEnabled:
    default: "false"
    description: Enable the race detector when building the test binary.
runs:
  using: composite
  steps:
    - name: Set WERF_TEST_* env vars
      run: |
        if ${{ inputs.coverage }}; then
          cat >> "$GITHUB_ENV" <<EOF
        WERF_TEST_BINARY_PATH=$GITHUB_WORKSPACE/bin/werf
        WERF_TEST_COVER_DIR=$GITHUB_WORKSPACE/covdata
        WERF_TEST_COVERAGE_DIR=$GITHUB_WORKSPACE/coverage
        EOF
        else
          cat >> "$GITHUB_ENV" <<EOF
        WERF_TEST_BINARY_PATH=$GITHUB_WORKSPACE/bin/werf
        EOF
        fi
      shell: bash

    - if: inputs.coverage == 'true'
      name: Create WERF_TEST_COVERAGE_DIR and WERF_TEST_COVER_DIR
      run: |
        mkdir -p "$WERF_TEST_COVERAGE_DIR"
        mkdir -p "$WERF_TEST_COVER_DIR"
      shell: bash

    - if: inputs.artifact != ''
      name: Download werf test binary
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/werf-test-binary

    - if: inputs.artifact != ''
      name: Extract werf test binary
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/bin"
        tar -xf "$RUNNER_TEMP/werf-test-binary/werf-test-binary.tar" -C "$GITHUB_WORKSPACE/bin"

    - if: inputs.artifact == ''
      name: Build werf test binary
      run: |
        if ${{ inputs.coverage }}; then
          task --yes build-with-coverage raceDetectorEnabled=${{ inputs.raceDetectorEnabled }}
        else
          task --yes build raceDetectorEnabled=${{ inputs.raceDetectorEnabled }}
        fi
      shell: bash
      env:
        TASK_X_REMOTE_TASKFILES: 1
