name: xxxxx(internal)

on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string
      packages:
        description: Comma-separated package paths to test
        type: string
      excludePackages:
        description: Comma-separated package paths to exclude from testing
        type: string
      coverage:
        default: false
        type: string
      forceSkip:
        default: false
        type: string
      timeout:
        default: 60
        type: number

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: "noninteractive"
  WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
  TASK_X_REMOTE_TASKFILES: 1
  WERF_TEST_BINARY_PATH: "${{ github.workspace }}/bin/werf"
  LD_LIBRARY_PATH: "/usr/local/lib/libgost"
  WERF_DOCKER_CONFIG: "/tmp/"

jobs:
  _:
    if: inputs.forceSkip == 'false'
    strategy:
      fail-fast: false
      matrix:
        kubeVersion: [1.31.6]

    runs-on: [self-hosted, large]
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - name: Set up JOB_ID
        run: |
          echo "JOB_ID=${GITHUB_RUN_ID}-${RANDOM}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          cache: true
          go-version-file: go.mod

      - name: Set up prebuilt werf test binary
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: ${{ inputs.coverage }}

      - name: Set up git config
        uses: ./.github/actions/set-up-git-config

      - name: Setup PATH
        run: |
          echo "/usr/local/golangci-lint-1.57.1:$HOME/go/bin" >> $GITHUB_PATH

      - name: Install ginkgo
        run: task --yes -p deps:install:ginkgo

      - name: Setup environment
        run: task --yes test:setup:environment

      - name: Test
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/werf.kubeconfig-${JOB_ID}"
          export WERF_TEST_K8S_DOCKER_REGISTRY="localhost:$(docker inspect kind-registry-${JOB_ID} --format '{{(index (index .NetworkSettings.Ports "5000/tcp") 0).HostPort}}')"
          test -n "${{ inputs.packages }}" && paths=paths="$(echo ${{ inputs.packages }} | tr , ' ')"
          task --yes -p test:e2e:${{ inputs.scope }} $paths kubeVersion=${{ matrix.kubeVersion }} -- --keep-going --skip-package '${{ inputs.excludePackages }}' --skip "Buildah"
          echo loadavg: $(cat /proc/loadavg)
        env:
          GOCOVERDIR: ${{ env.WERF_TEST_COVER_DIR }}

      - name: Upload coverage artifact
        uses: ./.github/actions/upload-coverage-artifact
        with:
          coverage: ${{ inputs.coverage }}

      - name: Cleanup environment
        if: always()
        run: task --yes test:cleanup:environment
