name: release:publish-binary

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v2.72.1-dk)"
        required: true

env:
  DEBIAN_FRONTEND: "noninteractive"
  TASK_X_REMOTE_TASKFILES: 1
  LD_LIBRARY_PATH: "/usr/local/lib/libgost"

jobs:
  publish:
    name: Build and publish binary
    runs-on: [self-hosted, regular]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up git config
        uses: ./.github/actions/set-up-git-config

      - name: Reach the internal Go modules on fox
        env:
          FOX_DELIVERY_KIT_SDK_DEPLOY_TOKEN: ${{ secrets.FOX_DELIVERY_KIT_SDK_DEPLOY_TOKEN }}
          FOX_ELFEDIT_DEPLOY_TOKEN: ${{ secrets.FOX_ELFEDIT_DEPLOY_TOKEN }}
        run: |
          for name in FOX_DELIVERY_KIT_SDK_DEPLOY_TOKEN FOX_ELFEDIT_DEPLOY_TOKEN; do
            [[ -n "${!name}" ]] || { echo "::error::$name is empty: the secret is missing"; exit 1; }
          done
          git config --global url."https://delivery-kit-ci:${FOX_DELIVERY_KIT_SDK_DEPLOY_TOKEN}@fox.flant.com/deckhouse/delivery/delivery-kit-sdk".insteadOf "https://flant.internal/deckhouse/delivery/delivery-kit-sdk"
          git config --global url."https://delivery-kit-ci:${FOX_ELFEDIT_DEPLOY_TOKEN}@fox.flant.com/deckhouse/delivery/elfedit".insteadOf "https://flant.internal/deckhouse/delivery/elfedit"
          echo "GOPRIVATE=flant.internal" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Set version
        run: echo "VERSION=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Build binary (linux/amd64)
        run: |
          task --yes build:dist:linux:amd64 version="$VERSION"
          file dist/$VERSION/linux-amd64/bin/werf | grep -Eq "x86-64.*statically linked.*Linux"

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          tag_name: ${{ env.VERSION }}
          files: dist/${{ env.VERSION }}/linux-amd64/bin/werf

  notify:
    if: always()
    needs: publish
    uses: werf/common-ci/.github/workflows/notification.yml@main
    secrets:
      loopNotificationGroup: ${{ secrets.LOOP_NOTIFICATION_GROUP }}
      webhook: ${{ secrets.LOOP_NOTIFICATION_WEBHOOK }}
      notificationChannel: ${{ secrets.LOOP_NOTIFICATION_CHANNEL }}
