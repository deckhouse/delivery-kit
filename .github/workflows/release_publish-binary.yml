name: release:publish-binary

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    name: Build and publish binary
    runs-on: [self-hosted, regular]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          path: ${{ github.job }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.11

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary (linux/amd64)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          task --yes build:dist:linux:amd64 version="$VERSION"
          file dist/$VERSION/linux-amd64/bin/werf | grep -Eq "x86-64.*statically linked.*Linux"
          cp dist/$VERSION/linux-amd64/bin/werf dist/delivery-kit-linux-amd64

      - name: Upload binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          echo "Uploading delivery-kit-linux-amd64 to release $TAG"
          gh release upload "$TAG" dist/delivery-kit-linux-amd64 --clobber --name "delivery-kit-linux-amd64"

  notify:
    if: always()
    needs: publish
    uses: werf/common-ci/.github/workflows/notification.yml@main
    secrets:
      loopNotificationGroup: ${{ secrets.LOOP_NOTIFICATION_GROUP }}
      webhook: ${{ secrets.LOOP_NOTIFICATION_WEBHOOK }}
      notificationChannel: ${{ secrets.LOOP_NOTIFICATION_CHANNEL }}
