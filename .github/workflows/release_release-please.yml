name: release:release-please
on:
  push:
    branches:
      - "main"
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+"
      - "[0-9]+"
  repository_dispatch:
    types: ["release:release-please"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: [self-hosted, regular]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next -dk version
        id: version
        env:
          MANIFEST_FILE: ${{ format('.release-please/{0}/manifest.json', github.ref_name) }}
        run: |
          last="$(jq -r '."."' "$MANIFEST_FILE")"
          range="HEAD"
          git rev-parse -q --verify "refs/tags/v${last}" >/dev/null && range="v${last}..HEAD"
          if grep -qi '^Release-As:' <<<"$(git log --format=%B "$range")"; then
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! $last =~ ^(.+)-dk\.([0-9]+)$ ]]; then
            echo "manifest version '$last' is not <semver>-dk.<N>: pin the next one with a Release-As footer" >&2
            exit 1
          fi
          echo "next=${BASH_REMATCH[1]}-dk.$(( BASH_REMATCH[2] + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # release-please-action@v5 drops its release-as input in manifest mode
      # (googleapis/release-please-action src/index.ts loadOrBuildManifest),
      # the CLI passes it through.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          args=(
            --repo-url="${{ github.repository }}"
            --target-branch="${{ github.ref_name }}"
            --token="$GITHUB_TOKEN"
            --config-file="release-please-config.json"
            --manifest-file="${{ format('.release-please/{0}/manifest.json', github.ref_name) }}"
          )
          npx --yes release-please@17.6.0 github-release "${args[@]}"
          npx --yes release-please@17.6.0 release-pr "${args[@]}" ${NEXT_VERSION:+--release-as="$NEXT_VERSION"}
  notify:
    if: failure()
    needs: release-please
    uses: werf/common-ci/.github/workflows/notification.yml@main
    secrets:
      loopNotificationGroup: ${{ secrets.LOOP_NOTIFICATION_GROUP }}
      webhook: ${{ secrets.LOOP_NOTIFICATION_WEBHOOK }}
      notificationChannel: ${{ secrets.LOOP_NOTIFICATION_CHANNEL }}
