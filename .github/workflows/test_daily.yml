name: test:daily

on:
  schedule:
    - cron: "0 8 * * *"
  repository_dispatch:
    types: ["test:daily"]
  workflow_dispatch:

env:
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2"
  JOB_ID: ""

jobs:
  lint:
    runs-on: delivery-github-runner
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      GOMAXPROCS: "4"
      GOFLAGS: "-p=4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base
        with:
          installGolangciLint: "true"

      - name: Lint
        run: task --yes lint

      - name: Check generated mocks are up to date
        run: task --yes mock:check

  unit:
    needs:
      - lint
    runs-on: delivery-github-runner
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      GOMAXPROCS: "4"
      GOFLAGS: "-p=4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base

      - name: Unit tests
        run: task --yes test:unit -- --procs=2 --compilers=1 --race --keep-going

  build_test_binary:
    if: always() && needs.lint.result == 'success' && needs.unit.result == 'success'
    needs:
      - lint
      - unit
    runs-on: delivery-github-runner
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      GOMAXPROCS: "4"
      GOFLAGS: "-p=4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base

      - name: Build werf test binary
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "true"
          raceDetectorEnabled: "true"

      - name: Package werf test binary
        run: tar -cf "$RUNNER_TEMP/werf-test-binary.tar" -C bin werf

      - name: Upload werf test binary
        uses: actions/upload-artifact@v7
        with:
          name: werf-test-binary
          path: ${{ runner.temp }}/werf-test-binary.tar
          if-no-files-found: error
          retention-days: 35
          overwrite: true

  integration_main:
    if: always() && needs.lint.result == 'success' && needs.unit.result == 'success' && needs.build_test_binary.result == 'success'
    needs:
      - lint
      - unit
      - build_test_binary
    runs-on: delivery-github-runner
    timeout-minutes: 210
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
    steps:
      - name: Checkout code
        timeout-minutes: 10
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        timeout-minutes: 10
        uses: ./.github/actions/set-up-ci-base
        with:
          prepareMultiarch: "true"

      - name: Set up prebuilt werf test binary
        timeout-minutes: 10
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "true"
          raceDetectorEnabled: "true"
          artifact: werf-test-binary

      - name: Set up git config
        timeout-minutes: 10
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        timeout-minutes: 10
        run: command -v ginkgo >/dev/null 2>&1 || task --yes deps:install:ginkgo

      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: Integration tests (main)
        timeout-minutes: 120
        run: |
          export GOCOVERDIR="$WERF_TEST_COVER_DIR"
          task --yes test:integration paths="test/legacy_e2e/suites" -- --procs=2 --compilers=1 --timeout=115m --flake-attempts=3 --keep-going --skip-package 'test/legacy_e2e/suites/deploy,test/legacy_e2e/suites/cleanup_after_converge,test/legacy_e2e/suites/helm/deploy_rollback,test/legacy_e2e/suites/bundles,test/legacy_e2e/suites/build/stapel_image/git,test/legacy_e2e/suites/docs'
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

      - name: Upload coverage artifact
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/upload-coverage-artifact
        with:
          coverage: true

  integration_git:
