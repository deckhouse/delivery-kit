          task --yes test:integration paths="test/legacy_e2e/suites/cleanup_after_converge test/legacy_e2e/suites/deploy test/legacy_e2e/suites/helm/deploy_rollback" -- --procs=2 --compilers=1 --timeout=115m --keep-going
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
