      - name: Upload coverage artifact
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/upload-coverage-artifact
        with:
          coverage: true

  e2e_simple_per_k8s:
    if: always() && needs.lint.result == 'success' && needs.unit.result == 'success' && needs.build_test_binary.result == 'success'
    needs:
      - lint
