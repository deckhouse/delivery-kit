  coverage_report:
    runs-on: delivery-github-runner
    timeout-minutes: 30
    needs:
      - integration_main
      - integration_git
      - integration_per_k8s
      - e2e_simple_per_k8s
      - e2e_complex_per_k8s
      - e2e_extra_per_k8s
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          path: coverage
          pattern: coverage-*

      - name: Format and upload coverage report
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/coverage-*/*.out
          validate: false
          skip-errors: false

