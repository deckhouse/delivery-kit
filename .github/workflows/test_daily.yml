  coverage_report:
    runs-on: delivery-github-runner
    timeout-minutes: 30
    needs:
      - integration_main
      - integration_git
      - integration_per_k8s
      - e2e_simple_per_k8s
      - e2e_complex_per_k8s
      - e2e_extra_per_k8s
