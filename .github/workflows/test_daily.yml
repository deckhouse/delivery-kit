      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: Integration tests (git)
        timeout-minutes: 120
        run: |
          export GOCOVERDIR="$WERF_TEST_COVER_DIR"
          task -p --yes test:integration paths="test/legacy_e2e/suites/build/stapel_image/git" -- --timeout=115m --flake-attempts=3 --keep-going
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
