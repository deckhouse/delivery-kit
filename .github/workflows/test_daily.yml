name: test:daily

on:
  schedule:
    - cron: "0 8 * * *"
  repository_dispatch:
    types: ["test:daily"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: delivery-github-runner
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base
        with:
          installGolangciLint: "true"

      - name: Lint
        run: task --yes lint

      - name: Check generated mocks are up to date
        run: task --yes mock:check

  unit:
    needs:
      - lint
    runs-on: delivery-github-runner
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base

      - name: Unit tests
        run: task -p --yes test:unit -- --keep-going

  integration_main:
    if: always() && needs.lint.result == 'success' && needs.unit.result == 'success'
    needs:
      - lint
      - unit
    runs-on: delivery-github-runner
    timeout-minutes: 160
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
      JOB_ID: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base
        with:
          prepareMultiarch: "true"

      - name: Set up prebuilt werf test binary
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "true"

      - name: Set up git config
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        run: |
          GOBIN="$RUNNER_TEMP/ginkgo-bin" task --yes deps:install:ginkgo
          echo "$RUNNER_TEMP/ginkgo-bin" >> "$GITHUB_PATH"

      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: Integration tests (main)
        timeout-minutes: 120
        run: |
          export GOCOVERDIR="$WERF_TEST_COVER_DIR"
          task -p --yes test:integration paths="test/legacy_e2e/suites" -- --timeout=115m --flake-attempts=3 --keep-going --skip-package 'test/legacy_e2e/suites/deploy,test/legacy_e2e/suites/cleanup_after_converge,test/legacy_e2e/suites/helm/deploy_rollback,test/legacy_e2e/suites/bundles,test/legacy_e2e/suites/ansible,test/legacy_e2e/suites/build/stapel_image/git,test/legacy_e2e/suites/docs'
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

      - name: Upload coverage artifact
        if: always()
        uses: ./.github/actions/upload-coverage-artifact
        with:
          coverage: true

  integration_git:
    if: always() && needs.lint.result == 'success' && needs.unit.result == 'success'
    needs:
      - lint
      - unit
    runs-on: delivery-github-runner
    timeout-minutes: 160
    env:
      DEBIAN_FRONTEND: noninteractive
