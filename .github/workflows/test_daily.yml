      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: Integration tests (per-k8s)
        timeout-minutes: 120
        run: |
          export GOCOVERDIR="$WERF_TEST_COVER_DIR"
          task -p --yes test:integration paths="test/legacy_e2e/suites/cleanup_after_converge test/legacy_e2e/suites/deploy test/legacy_e2e/suites/helm/deploy_rollback" -- --timeout=115m --keep-going
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

      - name: Upload coverage artifact
        if: always()
        uses: ./.github/actions/upload-coverage-artifact
        with:
          coverage: true

  e2e_simple_per_k8s:
    if: always() && needs.lint.result == 'success' && needs.unit.result == 'success'
    needs:
      - lint
      - unit
    runs-on: delivery-github-runner
    timeout-minutes: 160
    env:
      DEBIAN_FRONTEND: noninteractive
