name: tests:all

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [tests:all]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name || 'adhoc' }}
  cancel-in-progress: true

env:
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2"
  JOB_ID: ""

jobs:
  detect-changes:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: delivery-github-runner
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      workflow_proceed: ${{ steps.changes.outputs.workflow_proceed || 'true' }}
      docs_workflow_proceed: ${{ steps.changes.outputs.docs_workflow_proceed || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect changes
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            workflow_proceed:
              - 'go.mod'
              - 'Taskfile.dist.yaml'
              - '.github/**'
              - 'cmd/werf/**'
              - 'pkg/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'test/**'
            docs_workflow_proceed:
              - '.github/**'
              - 'Taskfile.dist.yaml'
              - 'cmd/werf/**'
              - 'docs/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'test/legacy_e2e/suites/docs/**'
              - 'README.md'
              - 'go.mod'

  lint:
    if: github.ref == 'refs/heads/main' || needs.detect-changes.outputs.workflow_proceed != 'false'
    needs: detect-changes
    runs-on: delivery-github-runner
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      GOMAXPROCS: "4"
      GOFLAGS: "-p=4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base
        with:
          installGolangciLint: "true"

      - name: Lint
        id: lint
        run: task --yes lint

      - name: Check generated mocks are up to date
        run: task --yes mock:check

  unit:
    if: github.ref == 'refs/heads/main' || needs.detect-changes.outputs.workflow_proceed != 'false'
    needs:
      - detect-changes
      - lint
    runs-on: delivery-github-runner
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      GOMAXPROCS: "4"
      GOFLAGS: "-p=4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base

      - name: Unit tests
        run: task --yes test:unit -- --procs=3 --compilers=1 --keep-going

  build_test_binary:
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.workflow_proceed != 'false') &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success'
    needs:
      - detect-changes
      - lint
      - unit
    runs-on: delivery-github-runner
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      GOMAXPROCS: "4"
      GOFLAGS: "-p=4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base

      - name: Set up prebuilt werf test binary
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "false"

      - name: Package werf test binary
        run: tar -cf "$RUNNER_TEMP/werf-test-binary.tar" -C bin werf

      - name: Upload werf test binary
        uses: actions/upload-artifact@v7
        with:
          name: werf-test-binary
          path: ${{ runner.temp }}/werf-test-binary.tar
          if-no-files-found: error
          retention-days: 35
          overwrite: true

  integration_main:
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.workflow_proceed != 'false') &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.build_test_binary.result == 'success'
    needs:
      - detect-changes
      - lint
      - unit
      - build_test_binary
    runs-on: delivery-github-runner
    timeout-minutes: 150
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
    steps:
      - name: Checkout code
        timeout-minutes: 10
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        timeout-minutes: 10
        uses: ./.github/actions/set-up-ci-base
        with:
          prepareMultiarch: "true"

      - name: Set up test runtime
        timeout-minutes: 10
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "false"
          artifact: werf-test-binary

      - name: Set up git config
        timeout-minutes: 10
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        timeout-minutes: 10
        run: command -v ginkgo >/dev/null 2>&1 || task --yes deps:install:ginkgo

      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: Integration tests (main)
        timeout-minutes: 60
        run: |
          task --yes test:integration paths="test/legacy_e2e/suites" -- --procs=3 --compilers=1 --timeout=55m --flake-attempts=3 --keep-going --skip-package 'test/legacy_e2e/suites/cleanup_after_converge,test/legacy_e2e/suites/build/stapel_image/git,test/legacy_e2e/suites/docs,test/legacy_e2e/suites/ansible'
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

  e2e_simple:
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.workflow_proceed != 'false') &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.build_test_binary.result == 'success'
    needs:
      - detect-changes
      - lint
      - unit
      - build_test_binary
    runs-on: delivery-github-runner
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
    steps:
      - name: Checkout code
        timeout-minutes: 10
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        timeout-minutes: 10
        uses: ./.github/actions/set-up-ci-base
        with:
          prepareMultiarch: "true"

      - name: Set up test runtime
        timeout-minutes: 10
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "false"
          artifact: werf-test-binary

      - name: Set up git config
        timeout-minutes: 10
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        timeout-minutes: 10
        run: command -v ginkgo >/dev/null 2>&1 || task --yes deps:install:ginkgo

      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: E2E tests (simple)
        timeout-minutes: 90
        run: |
          task --yes test:e2e:simple -- --procs=3 --compilers=1 --keep-going --timeout=85m --poll-progress-after=10m --poll-progress-interval=2m
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

  e2e_complex:
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.workflow_proceed != 'false') &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.build_test_binary.result == 'success'
    needs:
      - detect-changes
      - lint
      - unit
      - build_test_binary
    runs-on: delivery-github-runner
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
    steps:
      - name: Checkout code
        timeout-minutes: 10
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        timeout-minutes: 10
        uses: ./.github/actions/set-up-ci-base
        with:
          prepareMultiarch: "true"

      - name: Set up test runtime
        timeout-minutes: 10
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "false"
          artifact: werf-test-binary

      - name: Set up git config
        timeout-minutes: 10
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        timeout-minutes: 10
        run: command -v ginkgo >/dev/null 2>&1 || task --yes deps:install:ginkgo

      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: E2E tests (complex)
        timeout-minutes: 90
        run: |
          task --yes test:e2e:complex -- --procs=3 --compilers=1 --keep-going --timeout=85m --poll-progress-after=10m --poll-progress-interval=2m
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

  e2e_extra:
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.workflow_proceed != 'false') &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.build_test_binary.result == 'success'
    needs:
      - detect-changes
      - lint
      - unit
      - build_test_binary
    runs-on: delivery-github-runner
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
    steps:
      - name: Checkout code
        timeout-minutes: 10
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        timeout-minutes: 10
        uses: ./.github/actions/set-up-ci-base
        with:
          prepareMultiarch: "true"

      - name: Set up test runtime
        timeout-minutes: 10
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "false"
          artifact: werf-test-binary

      - name: Set up git config
        timeout-minutes: 10
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        timeout-minutes: 10
        run: command -v ginkgo >/dev/null 2>&1 || task --yes deps:install:ginkgo

      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: E2E tests (extra)
        timeout-minutes: 90
        run: |
          task --yes test:e2e:extra -- --procs=3 --compilers=1 --keep-going --timeout=85m --poll-progress-after=10m --poll-progress-interval=2m
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

  integration_git:
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.workflow_proceed != 'false') &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.build_test_binary.result == 'success'
    needs:
      - detect-changes
      - lint
      - unit
      - build_test_binary
    runs-on: delivery-github-runner
    timeout-minutes: 150
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
    steps:
      - name: Checkout code
        timeout-minutes: 10
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        timeout-minutes: 10
        uses: ./.github/actions/set-up-ci-base
        with:
          prepareMultiarch: "true"

      - name: Set up test runtime
        timeout-minutes: 10
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "false"
          artifact: werf-test-binary

      - name: Set up git config
        timeout-minutes: 10
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        timeout-minutes: 10
        run: command -v ginkgo >/dev/null 2>&1 || task --yes deps:install:ginkgo

      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: Integration tests (git)
        timeout-minutes: 60
        run: |
          task --yes test:integration paths="test/legacy_e2e/suites/build/stapel_image/git" -- --procs=3 --compilers=1 --timeout=55m --flake-attempts=3 --keep-going
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

  docs_unit:
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.docs_workflow_proceed != 'false'
    needs:
      - detect-changes
    runs-on: delivery-github-runner
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      GOMAXPROCS: "4"
      GOFLAGS: "-p=4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base

      - name: Set up prebuilt werf test binary
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "false"

      - name: Set up git config
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        run: command -v ginkgo >/dev/null 2>&1 || task --yes deps:install:ginkgo

      - name: Doc unit tests
        run: |
          task --yes test:unit paths="cmd/werf/docs" -- --procs=3 --compilers=1 --keep-going
          echo loadavg: $(cat /proc/loadavg)

  docs_integration:
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.docs_workflow_proceed != 'false' &&
      needs.build_test_binary.result == 'success'
    needs:
      - detect-changes
      - build_test_binary
    runs-on: delivery-github-runner
    timeout-minutes: 150
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
      WERF_TEST_K8S_DOCKER_REGISTRY_INSECURE: "false"
    steps:
      - name: Checkout code
        timeout-minutes: 10
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        timeout-minutes: 10
        uses: ./.github/actions/set-up-ci-base
        with:
          prepareMultiarch: "true"

      - name: Set up prebuilt werf test binary
        timeout-minutes: 10
        uses: ./.github/actions/set-up-prebuilt-werf-test-binary
        with:
          coverage: "false"
          artifact: werf-test-binary

      - name: Set up git config
        timeout-minutes: 10
        uses: ./.github/actions/set-up-git-config

      - name: Install ginkgo
        timeout-minutes: 10
        run: command -v ginkgo >/dev/null 2>&1 || task --yes deps:install:ginkgo

      - name: Set up test environment
        uses: ./.github/actions/set-up-test-environment
        timeout-minutes: 20

      - name: Doc integration tests
        timeout-minutes: 60
        run: |
          task --yes test:integration paths="test/legacy_e2e/suites/docs" -- --procs=3 --compilers=1 --timeout=55m --flake-attempts=3 --keep-going
          echo loadavg: $(cat /proc/loadavg)

      - name: Cleanup environment
        if: always() && env.JOB_ID != ''
        timeout-minutes: 5
        run: |
          task --yes test:cleanup:environment
          rm -f "$KUBECONFIG"

  docs_check_links:
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.docs_workflow_proceed != 'false'
    needs:
      - detect-changes
    runs-on: delivery-github-runner
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up CI base
        uses: ./.github/actions/set-up-ci-base

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.SERVICE_ACCOUNT }}
          password: ${{ secrets.SERVICE_ACCOUNT_TOKEN }}

      - name: Check links
        run: task --yes -o group -p doc:check-broken-links
        env:
          WERF_REPO: "ghcr.io/werf/werfio"

  notify:
    if: |
      always() && (
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && failure()) ||
      (github.event_name != 'pull_request' && failure())
      )
    needs:
      - lint
      - unit
      - build_test_binary
      - integration_main
      - e2e_simple
      - e2e_complex
      - e2e_extra
      - integration_git
      - docs_unit
      - docs_integration
      - docs_check_links
    uses: werf/common-ci/.github/workflows/notification.yml@main
    secrets:
      loopNotificationGroup: ${{ secrets.LOOP_NOTIFICATION_GROUP }}
      webhook: ${{ secrets.LOOP_NOTIFICATION_WEBHOOK }}
      notificationChannel: ${{ secrets.LOOP_NOTIFICATION_CHANNEL }}
