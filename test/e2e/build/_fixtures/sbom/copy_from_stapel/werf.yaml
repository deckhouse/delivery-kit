project: werf-test-e2e-build-sbom-copy-from-stapel
configVersion: 1
build:
  sbom:
    enable: true
---
image: app
from: registry.werf.io/base/ubuntu:22.04
import:
  - image: registry.werf.io/base/alpine
    add: /etc/alpine-release
    to: /copied/alpine-release
    after: install
  - image: registry.werf.io/base/alpine
    add: /etc/ssl
    to: /copied/ssl
    after: install
shell:
  setup:
    - touch /created-by-stapel
