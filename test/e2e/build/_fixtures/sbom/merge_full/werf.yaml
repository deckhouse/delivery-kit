project: werf-test-e2e-build-sbom-merge-full
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: builder
from: registry.werf.io/werf/scratch
git:
  - add: /
    to: /src
sbom:
  fragment: |
    components:
      - name: builder-custom
        type: library
        version: 1.0.0
        purl: pkg:generic/builder-custom@1.0.0
---
image: app
from: registry.werf.io/werf/scratch
import:
  - image: builder
    add: /src
    to: /app
    after: install
sbom:
  fragment: |
    components:
      - name: app-custom
        type: application
        version: 2.0.0
        purl: pkg:generic/app-custom@2.0.0

