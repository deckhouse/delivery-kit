project: werf-test-e2e-build-sbom-packages
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
shell:
  beforeInstall:
    - mkdir -p /usr/local/bin /var/lib/pm /opt
    - |
      cat > /opt/pm-index.json <<'IDX'
      {
        "demo-app": {"name":"demo-app","arch":["linux/amd64"],"default":true,"depends":["demo-lib"],"description":"e2e demo package","license":"MIT","originalRepo":"https://example.com/demo-app","repo":"example/demo-app","type":"runtime","version":"9.9.9","digest":"sha256:1111111111111111111111111111111111111111111111111111111111111111"},
        "demo-lib": {"name":"demo-lib","arch":["linux/amd64"],"default":true,"description":"e2e transitive lib","license":"MIT","originalRepo":"https://example.com/demo-lib","repo":"example/demo-lib","type":"runtime","version":"2.0.0","digest":"sha256:2222222222222222222222222222222222222222222222222222222222222222"}
      }
      IDX
    - |
      cat > /usr/local/bin/pm <<'PM'
      #!/bin/sh
      case "$1" in
        install) cp /opt/pm-index.json /var/lib/pm/index.json ;;
        info) cat /var/lib/pm/index.json ;;
      esac
      PM
    - chmod +x /usr/local/bin/pm
packages:
  - type: os-pm
    spec:
      - demo-app
