project: werf-test-e2e-sign-files
configVersion: 1
---
image: sysext
from: alpine:3.20
shell:
  install:
  - mkdir -p /out
  - printf '%s' 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b > /out/ext.roothash
  setup:
  - test -s /out/ext.roothash.p7s
sign:
- path: /out/ext.roothash
  after: install
