project: werf-test-e2e-sbom-final-repo-import
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: carrier
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /
packages:
  - type: os-pm
    spec:
      - jq==1.8.1
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
import:
  - image: carrier
    add: /werf.yaml
    to: /imported/werf.yaml
    before: install
