project: werf-test-e2e-sbom-final-repo-import
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: carrier
from: registry.werf.io/werf/scratch:latest
git:
  - add: /
    to: /c
---
image: app
from: registry.werf.io/werf/scratch:latest
git:
  - add: /
    to: /a
import:
  - image: carrier
    add: /c/werf.yaml
    to: /imported/werf.yaml
    before: setup
