project: werf-test-e2e-sbom-i1-cache
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: scratch
git:
  - add: /data
    to: /app
shell:
  install:
    - echo INCREMENT1_INSTALL_EXECUTED
    - echo installed > /app/install.marker
  setup:
    - echo INCREMENT1_SETUP_EXECUTED_v1
    - echo setup-v1 > /app/setup.marker
---
image: stable
from: scratch
shell:
  install:
    - echo INCREMENT1_STABLE_EXECUTED
    - mkdir -p /tmp
    - echo stable > /tmp/stable.marker
