project: werf-test-e2e-sbom-i1-checked-generated-exec
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: gen
final: false
from: scratch
imageSpec:
  config:
    workingDir: /out
git:
  - add: /data
    to: /gen-src
shell:
  install:
    - /.werf/stapel/embedded/bin/mkdir -p /out
    # the stapel tools have no chmod: install -m 0755 makes the executable generated file
    - printf "#!/bin/sh\necho generated\n" > /out/tool.src
    - /.werf/stapel/embedded/bin/install -m 0755 /out/tool.src /out/tool.sh
    - /.werf/stapel/embedded/bin/rm /out/tool.src
---
image: app
from: scratch
import:
  - image: gen
    add: /out
    to: /app
    after: install
