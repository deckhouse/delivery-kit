project: werf-test-e2e-sbom-i1-service-path-written
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: "@BASE@"
git:
  - add: /data
    to: /app
shell:
  install:
    # A recipe writing a file under /.werf/ that is not a werf service file: the gate must not read the whole
    # directory as werf's own.
    # The stapel tools are not on PATH of a scratch base; the shell builtins are.
    - /.werf/stapel/embedded/bin/mkdir -p /.werf/user
    - echo not-a-werf-file > /.werf/user/payload.txt
