project: werf-test-e2e-sbom-rust-cargo-simple
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: registry.deckhouse.io/container-factory@sha256:7aac8d97a91ac233b19111aaad9d7bba12b975e620cfa9287b97e0003e4d0a71
git:
  - add: /
    to: /app
    stageDependencies:
      packages:
        - Cargo.toml
        - Cargo.lock
shell:
  install:
    - cd /app && cargo build --release
packages:
  - type: os-pm
    spec:
      - rust==1.96.0
      - cargo==1.96.0
      - curl==8.12.1
  - type: rust-cargo
    workdir: /app
