project: werf-test-e2e-sbom-lua-bytecode
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: donor
from: registry.deckhouse.io/container-factory@sha256:7aac8d97a91ac233b19111aaad9d7bba12b975e620cfa9287b97e0003e4d0a71
git:
  - add: /
    to: /app
    stageDependencies:
      packages:
        - werf-sbom-lua-bytecode-0.1-1.rockspec
packages:
  - type: os-pm
    spec:
      - lua==5.3.6
      - luarocks==3.12.2
  - type: lua-rock
    workdir: /app
    spec: werf-sbom-lua-bytecode-0.1-1.rockspec
shell:
  install:
    - |
      set -eu
      lua=$(command -v lua5.3 || command -v lua)
      echo "check lua version"
      "$lua" -v 2>&1 | grep -q '^Lua 5\.3\.'
      tree=/root/.luarocks/share/lua/5.3
      rocks=/root/.luarocks/lib/luarocks/rocks-5.3
      echo "check rock manifests"
      grep -q '"inspect.lua"' "$rocks/inspect/3.1.3-0/rock_manifest"
      grep -q '"ansicolors.lua"' "$rocks/ansicolors/1.0.2-3/rock_manifest"
      # The os-pm lua package ships no luac; string.dump emits the same format.
      cat > /tmp/compile.lua <<'EOF'
      local src, out, strip = arg[1], arg[2], arg[3] == "strip"
      local f = assert(loadfile(src))
      local h = assert(io.open(out, "wb"))
      h:write(string.dump(f, strip))
      h:close()
      EOF
      cd "$tree"
      echo "compile inspect and ansicolors"
      "$lua" /tmp/compile.lua inspect.lua inspect.luac
      "$lua" /tmp/compile.lua ansicolors.lua ansicolors.luac
      "$lua" /tmp/compile.lua ansicolors.lua ansicolors.ljbc strip
      echo "compile decoy and stray bytecode"
      printf 'return "not ansicolors"\n' > /tmp/decoy.lua
      "$lua" /tmp/compile.lua /tmp/decoy.lua ansicolors.lc strip
      rm /tmp/decoy.lua
      mkdir stray
      "$lua" /tmp/compile.lua inspect.lua stray/inspect.luac strip
      rm /tmp/compile.lua inspect.lua
      test ! -e inspect.lua
      test -f ansicolors.lua
      cd /
      echo "check require of inspect.luac"
      "$lua" -e '
        local tree = "/root/.luarocks/share/lua/5.3"
        package.path = tree .. "/?.luac;" .. package.path
        assert(package.searchpath("inspect", package.path) == tree .. "/inspect.luac", package.path)
        local inspect = require("inspect")
        assert(inspect({1, 2}) == "{ 1, 2 }", inspect({1, 2}))
      '
---
image: consumer
from: registry.werf.io/werf/scratch:latest
import:
  - image: donor
    add: /root/.luarocks/share/lua/5.3/inspect.luac
    to: /opt/lua/inspect.luac
    before: setup
---
image: grandchild
from: registry.werf.io/werf/scratch:latest
import:
  - image: consumer
    add: /opt/lua/inspect.luac
    to: /srv/lua/inspect.luac
    before: setup
---
image: manifest-only
from: registry.werf.io/werf/scratch:latest
import:
  - image: donor
    add: /root/.luarocks/lib/luarocks/rocks-5.3/inspect/3.1.3-0/rock_manifest
    to: /root/.luarocks/lib/luarocks/rocks-5.3/inspect/3.1.3-0/rock_manifest
    before: setup
