project: werf-test-e2e-sbom-npm-simple
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
    stageDependencies:
      packages:
        - package.json
        - package-lock.json
packages:
  - type: os-pm
    spec:
      - node==24.18.0
  - type: javascript-npm
    workdir: /app
