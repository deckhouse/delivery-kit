project: werf-test-e2e-sbom-inject-ospm-gost
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
    gost:
      attackSurface: yes
      securityFunction: yes
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
sbom:
  gost:
    attackSurface: no
    securityFunction: indirect
shell:
  beforeInstall:
    - mkdir -p /usr/local/bin /var/lib/pm /opt
    - |
      cat > /opt/pm-index.json <<'IDX'
      {
        "demo-app": {"name":"demo-app","arch":["linux/amd64"],"default":true,"description":"e2e demo package","license":"MIT","originalRepo":"https://example.com/demo-app","repo":"example/demo-app","type":"runtime","version":"9.9.9","digest":"sha256:1111111111111111111111111111111111111111111111111111111111111111"}
      }
      IDX
    - |
      cat > /usr/local/bin/pm <<'PM'
      #!/bin/sh
      case "$1" in
        install) cp /opt/pm-index.json /var/lib/pm/index.json ;;
        info) cat /var/lib/pm/index.json ;;
      esac
      PM
    - chmod +x /usr/local/bin/pm
packages:
  - type: os-pm
    spec:
      - demo-app
