project: werf-test-e2e-sbom-inject-ospm-partial-import
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
# builder/distroless of base-images v3.1.16: the first catalog whose pm (0.1.12) records
# the files it unpacks in /var/lib/pm/files.json.
image: donor
from: registry.deckhouse.io/container-factory@sha256:e5e2af12a408de2dd466dbd634d4aef85ae4384dee91371b8a35662fe98c395c
packages:
  - type: os-pm
    spec:
      - curl==8.12.1
      - jq==1.8.1
---
# curl and the libraries it links, nothing of jq: the libraries are the files of curl's
# dependencies, so brotli, openssl, libc and the rest ship here while jq does not.
image: app
from: registry.werf.io/werf/scratch:latest
import:
  - from: donor
    add: /usr/bin/curl
    to: /usr/bin/curl
    before: setup
  - from: donor
    add: /usr/lib
    to: /usr/lib
    before: setup
    includePaths:
      - ld-linux-x86-64.so.2
      - libc.so.6
      - libm.so.6
      - libdl.so.2
      - libpthread.so.0
      - libresolv.so.2
      - librt.so.1
      - libcurl.so.4
      - libcurl.so.4.8.0
      - libnghttp2.so.14
      - libnghttp2.so.14.28.5
      - libidn2.so.0
      - libidn2.so.0.4.0
      - libpsl.so.5
      - libpsl.so.5.3.5
      - libssl.so.3
      - libcrypto.so.3
      - libzstd.so.1
      - libzstd.so.1.5.7
      - libbrotlidec.so.1
      - libbrotlidec.so.1.1.0
      - libbrotlicommon.so.1
      - libbrotlicommon.so.1.1.0
      - libcares.so.2
      - libcares.so.2.19.4
      - libunistring.so.5
      - libunistring.so.5.2.1
