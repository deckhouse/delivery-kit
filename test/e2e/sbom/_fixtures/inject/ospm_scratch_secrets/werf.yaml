project: werf-test-e2e-sbom-inject-ospm-scratch-secrets
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: carrier
from: registry.deckhouse.io/container-factory@sha256:7aac8d97a91ac233b19111aaad9d7bba12b975e620cfa9287b97e0003e4d0a71
---
image: app
from: scratch
git:
  - add: /
    to: /
secrets:
  - env: PACKAGES_VERSION
  - env: REGISTRY
import:
  - image: carrier
    add: /usr/local/bin/pm
    to: /usr/local/bin/pm
    before: install
  - image: carrier
    add: /etc/ssl
    to: /etc/ssl
    before: install
packages:
  - type: os-pm
    env:
      PACKAGES_VERSION: "%secret:PACKAGES_VERSION%"
      REGISTRY: "%secret:REGISTRY%"
    spec:
      - curl==8.12.1
