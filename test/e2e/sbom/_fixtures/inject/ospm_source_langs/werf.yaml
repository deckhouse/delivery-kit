    env:
      PACKAGES_VERSION: sha256:ebf151229dec1d4253f68c73b0892b7eed5fed487ff54258a1efcb121ecea1e5
      REGISTRY: registry.deckhouse.io/container-factory
    spec:
      - curl==8.12.1
      - jq==1.8.1
