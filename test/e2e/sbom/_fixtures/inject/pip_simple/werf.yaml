project: werf-test-e2e-sbom-python-pip-simple
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
shell:
  install:
    - cd /app && pip install -r requirements.txt
packages:
  - type: pip
    workdir: /app
