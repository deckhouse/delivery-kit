project: werf-test-e2e-sbom-pnpm-simple
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
    excludePaths:
      - tools
    stageDependencies:
      packages:
        - package.json
        - pnpm-lock.yaml
  - add: /tools
    to: /opt/tools
    stageDependencies:
      packages:
        - package.json
        - package-lock.json
packages:
  - type: os-pm
    spec:
      - node==24.18.0
  - type: javascript-npm
    workdir: /opt/tools
  - type: javascript-pnpm
    workdir: /app
    manager: /opt/tools/node_modules/.bin/pnpm
