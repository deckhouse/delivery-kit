project: werf-test-e2e-sbom-python-poetry-simple
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
shell:
  install:
    - cd /app && poetry install --no-root
packages:
  - type: python-poetry
    workdir: /app
