project: werf-test-e2e-sbom-ruby-gemspec
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: registry.deckhouse.io/container-factory@sha256:7aac8d97a91ac233b19111aaad9d7bba12b975e620cfa9287b97e0003e4d0a71
git:
  - add: /
    to: /app
    stageDependencies:
      packages:
        - werf-sbom-ruby-app.gemspec
        - lib/**/*
packages:
  - type: os-pm
    spec:
      - ruby==3.4.10
  - type: ruby-gemspec
    workdir: /app
    spec: werf-sbom-ruby-app.gemspec
