project: werf-test-e2e-sbom-python-uv-simple
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
    excludePaths:
      - tools
    stageDependencies:
      packages:
        - pyproject.toml
        - uv.lock
  - add: /tools
    to: /opt/tools
    stageDependencies:
      packages:
        - requirements.txt
packages:
  - type: os-pm
    spec:
      - python==3.12.12
  - type: python-pip
    workdir: /opt/tools
    env:
      PIP_TARGET: /opt/tools
  - type: python-uv
    workdir: /app
    manager: /opt/tools/bin/uv
