project: werf-test-e2e-sbom-yarn-manager
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
    excludePaths:
      - tools
    stageDependencies:
      packages:
        - package.json
        - yarn.lock
  - add: /tools
    to: /opt/tools
    stageDependencies:
      packages:
        - package.json
        - package-lock.json
packages:
  - type: javascript-npm
    workdir: /opt/tools
  - type: javascript-yarn
    workdir: /app
    manager: /opt/tools/node_modules/.bin/yarn
