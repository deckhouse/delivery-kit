project: werf-test-e2e-sbom-lifecycle-multi
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
    gost:
      attackSurface: yes
      securityFunction: yes
---
image: frontend
from: {{ env "BUILDER_BASE_IMAGE" }}
packages:
  - type: os-pm
    spec:
      - jq
---
image: backend
from: {{ env "BUILDER_BASE_IMAGE" }}
packages:
  - type: os-pm
    spec:
      - yq
