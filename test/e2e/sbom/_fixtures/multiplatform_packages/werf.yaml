project: werf-test-e2e-sbom-multiplatform-packages
configVersion: 1
build:
  platform:
    - linux/amd64
    - linux/386
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /
packages:
  - type: os-pm
    spec: "pm.yaml"
    lock: "pm.lock"
