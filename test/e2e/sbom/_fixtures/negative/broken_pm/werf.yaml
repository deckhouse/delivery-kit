project: werf-test-e2e-sbom-broken-pm
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
shell:
  beforeInstall:
    - mkdir -p /usr/local/bin /var/lib/pm
    - |
      cat > /usr/local/bin/pm <<'PM'
      #!/bin/sh
      case "$1" in
        install) echo "ok" ;;
        info) echo "this is not valid json at all, definitely broken output" ;;
      esac
      PM
    - chmod +x /usr/local/bin/pm
packages:
  - type: os-pm
    spec:
      - demo-app
