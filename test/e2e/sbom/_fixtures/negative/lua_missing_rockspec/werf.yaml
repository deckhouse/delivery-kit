project: werf-test-e2e-sbom-lua-rock-missing
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
    stageDependencies:
      packages:
        - app-0.1-1.rockspec
packages:
  - type: lua-rock
    workdir: /app
    spec: app-0.1-1.rockspec
