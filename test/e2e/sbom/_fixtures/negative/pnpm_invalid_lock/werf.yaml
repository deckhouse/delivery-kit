project: werf-test-e2e-sbom-pnpm-invalid-lock
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
    stageDependencies:
      packages:
        - package.json
        - pnpm-lock.yaml
packages:
  - type: javascript-pnpm
    workdir: /app
    version: "9.15.4"