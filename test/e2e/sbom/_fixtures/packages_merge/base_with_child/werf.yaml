project: werf-test-e2e-sbom-packages-base
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: base-layer
from: {{ env "BUILDER_BASE_IMAGE" }}
packages:
  - type: os-pm
    spec:
      - jq
---
image: app
fromImage: base-layer
packages:
  - type: os-pm
    spec:
      - curl
