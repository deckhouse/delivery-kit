project: werf-test-e2e-sbom-packages-base
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: base-layer
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /
packages:
   - type: os-pm
     workdir: /
---
image: app
fromImage: base-layer
git:
  - add: /
    to: /
packages:
  - type: os-pm
    workdir: /
