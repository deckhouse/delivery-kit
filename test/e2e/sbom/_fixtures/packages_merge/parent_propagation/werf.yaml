project: werf-test-e2e-sbom-packages-propagation
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: base-builder
from: {{ env "BUILDER_BASE_IMAGE" }}
packages:
  - type: os-pm
    spec:
      - jq
---
image: app
fromImage: base-builder
shell:
  install:
    - mkdir -p /opt/app
