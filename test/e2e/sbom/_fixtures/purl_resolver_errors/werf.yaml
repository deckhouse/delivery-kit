project: werf-test-e2e-sbom-batch-purl-errors
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: image-fail-all
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /
packages:
  - type: os-pm
    spec: "pm.yaml"
    lock: "pm.lock"
---
image: image-fail-partial
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /
packages:
  - type: os-pm
    spec: "pm.yaml"
    lock: "pm.lock"
---
image: image-ok
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /
packages:
  - type: os-pm
    spec: "pm.yaml"
    lock: "pm.lock"