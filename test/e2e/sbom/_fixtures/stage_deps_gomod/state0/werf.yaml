project: werf-test-e2e-sbom-stage-deps-gomod
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: {{ env "BUILDER_BASE_IMAGE" }}
git:
  - add: /
    to: /app
    stageDependencies:
      packages:
        - go.mod
        - go.sum
shell:
  install:
    - cd /app && CGO_ENABLED=0 go build -o /bin/app .
packages:
  - type: go-mod
    workdir: /app
