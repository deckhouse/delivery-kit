project: werf-test-e2e-sbom-type-change
configVersion: 1
build:
  sbom:
    enable: true
    standard: cyclonedx@1.6
---
image: app
from: registry.deckhouse.io/container-factory@sha256:ef3bd2afef793bbaf31ce020550e577c7190cc7cb4cd9b3b3e9188587e3612cd
git:
  - add: /
    to: /app
    stageDependencies:
      packages:
        - go.mod
shell:
  install:
    - cd /app && CGO_ENABLED=0 go build -o /bin/app .
packages:
  - type: go-mod
    workdir: /app
